version: 2
sources:
    - name: datafeed_shared_schema
      database: "{{('sales')}}"
      schema: raw_schema
      tables:
        - name: raw_customerdata
        - name: raw_orders
          columns:
          - name: id   
            tests:
                - unique
                - not_null
          - name: status 
            tests: 
             - accepted_values:
                arguments: 
                  values: ['return_pending','shipped','refund','completed','placed','returned']    
       
        - name: customers

models:
  - name: customers
    columns:
      - name: id   
        tests:
          - unique
          - not_null
        
       